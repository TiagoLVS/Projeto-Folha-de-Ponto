name: Pacote Windows independente
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar ferramentas
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath 'frontend/node_modules') {
            Remove-Item -LiteralPath 'frontend/node_modules' -Recurse -Force -ErrorAction Stop
          }
          pnpm --dir frontend install --frozen-lockfile --config.node-linker=hoisted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix windows-app ci
      - name: Testar frontend
        shell: pwsh
        run: |
          pnpm --dir frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend exec tsc --noEmit --incremental false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend lint
      - name: Build frontend desktop
        shell: pwsh
        run: |
          pnpm --dir frontend check:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend build:desktop
      - name: Montar aplicativo
        shell: pwsh
        run: npm --prefix windows-app run build -- --prepare-only
      - name: Validar frontend
        shell: pwsh
        run: node windows-app/scripts/validate-frontend.cjs windows-app/staging/frontend
      - name: Testar rede/configuração
        shell: pwsh
        run: npm --prefix windows-app test
      - name: Smoke test dos serviços
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE='1'
          $scriptPath = (Resolve-Path '.\windows-app\scripts\smoke.cjs').Path
          $process = Start-Process -FilePath '.\windows-app\release\PontoDocente-win32-x64\PontoDocente.exe' -ArgumentList ('"' + $scriptPath + '"') -NoNewWindow -Wait -PassThru
          exit $process.ExitCode
      - name: Smoke test da janela Electron
        shell: pwsh
        run: node windows-app/scripts/smoke-gui.cjs
      - name: Gerar ZIP e SHA-256
        shell: pwsh
        run: node windows-app/scripts/archive.cjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PontoDocente-Windows-Independente-x64
          if-no-files-found: error
          path: |
            windows-app/release/*.zip
            windows-app/release/*.sha256
